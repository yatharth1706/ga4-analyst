[project]
name = "ga4-analyst"
version = "0.1.0"
description = "Agentic GA4 data-analysis chat backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "google-cloud-bigquery>=3.46.1",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]
